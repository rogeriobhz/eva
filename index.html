<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EVA - Escalonador de Horários Escolares">
  <meta name="theme-color" content="#2d6a4f">
  <title>EVA - Horários Escolares</title>

  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EVA">

  <link rel="stylesheet" href="/src/css/main.css">
  <script type="module" src="/src/js/app.js"></script>
</head>
<body>
  <!-- Tela de login -->
  <div id="lg" class="card" style="max-width:400px;margin:60px auto;text-align:center;display:none">
    <h2>🍎 EVA</h2>
    <p class="hint">Entre com sua conta Google para acessar suas escolas.</p>
    <button class="btn g" id="btn-login" onclick="FB.login()" style="width:100%;margin-top:16px">Entrar com Google</button>
    <p id="lm" class="hint" style="color:var(--er);min-height:1.2em"></p>
  </div>

  <!-- Aviso (visualização pública) -->
  <div id="lt" class="hint" style="text-align:center;padding:12px;display:none"></div>

  <!-- App -->
  <div class="app" style="display:none">
    <header>
      <h1>🍎 <span id="school-name">EVA</span></h1>
      <div class="head-right">
        <span id="who" class="hint"></span>
        <button class="btn" id="btn-out" onclick="FB.out()">Sair</button>
      </div>
    </header>

    <nav class="tabs" id="tb" role="tablist" aria-label="Abas principais"></nav>

    <main id="m" role="tabpanel"></main>
  </div>

  <!-- Área de impressão -->
  <div id="pv"></div>

  <template id="toast-template">
    <div class="toast"></div>
  </template>
</body>
</html>
