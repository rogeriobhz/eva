<html lang="pt-BR">
<head>

<style>
:root{color-scheme:light;--bg:#f3f6f7;--gr:rgba(19,93,117,.07);--sf:#fff;--tx:#14232a;--mt:#5d7179;--ln:#d9e3e7;--bd:#0a171c;--bt:#eef7fa;--yl:#135d75;--yt:#fff;--rd:#cd3d3b;--gn:#508d4e;--gt:#2f6b2d;--bl:#135d75;--bs:#dcebf1;--rs:#fbe0dd;--rt:#9a2f25;--gs:#dbeeda}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181b;--gr:rgba(98,182,207,.06);--sf:#192226;--tx:#e8f0f3;--mt:#93a7af;--ln:#27363c;--bd:#0a171c;--bt:#e8f0f3;--bl:#62b6cf;--bs:#173440;--rs:#4a2321;--rt:#ffb7b0;--gs:#1f3522;--gt:#8cc98a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181b;--gr:rgba(98,182,207,.06);--sf:#192226;--tx:#e8f0f3;--mt:#93a7af;--ln:#27363c;--bd:#0a171c;--bt:#e8f0f3;--bl:#62b6cf;--bs:#173440;--rs:#4a2321;--rt:#ffb7b0;--gs:#1f3522;--gt:#8cc98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;background:var(--bg) linear-gradient(var(--gr) 1px,transparent 1px) 0 0/100% 24px,linear-gradient(90deg,var(--gr) 1px,transparent 1px) 0 0/24px 100%;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--yl);z-index:10}
.app{max-width:560px;margin:auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.top{background:var(--yl);color:var(--bt);padding:18px 18px 28px;border-radius:0 0 28px 28px;position:relative}
.top::after{content:"";position:absolute;left:18px;right:18px;bottom:10px;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--bt) 0 10px,transparent 10px 18px);opacity:.25}
.logo{display:flex;align-items:center;gap:12px}
.logo-img{width:46px;height:46px;border-radius:22%;object-fit:cover;display:block;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}.logo-img.big{width:168px;height:168px;margin:14px auto 12px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.top h1{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:1.7rem;line-height:1;letter-spacing:.06em}
.top p{margin:2px 0 0;font-size:.85rem;opacity:.8}
.st{display:flex;gap:8px;margin-top:14px}
.st div{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;font-size:.78rem}
.st b{display:block;font-size:1.25rem;color:#fff}
main{padding:16px}
h2{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:1.2rem;line-height:1.25;margin:4px 0 12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 0 var(--ln)}
label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 5px;color:var(--mt)}
input,select{width:100%;padding:13px 14px;border:2px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--bl)}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
.btn{width:100%;border:0;background:var(--yl);color:var(--yt);font-weight:800;padding:15px;border-radius:16px;box-shadow:0 4px 0 #0c3f50}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c3f50}
.btn.g{background:var(--bs);color:var(--bl);box-shadow:none;padding:11px;font-weight:700}
.btn.d{background:var(--rd);color:#fff;box-shadow:none;padding:9px;font-weight:700;font-size:.85rem}
.btn.s{width:auto;padding:9px 14px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--bs);color:var(--bl);font-weight:700;padding:8px 8px 8px 14px;border-radius:999px;display:flex;gap:8px;align-items:center}
.chip i{font-style:normal;background:var(--bl);color:var(--bs);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;cursor:pointer}
.tn{font-weight:800;margin:14px 0 4px}.hb{display:flex;gap:8px;margin-top:10px}.hb button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}.hb button:disabled{opacity:.35;cursor:default}.lg2{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.lg2 label{display:flex;align-items:center;gap:6px;margin:0;font-size:.8rem;font-weight:600;color:var(--tx)}.lg2 input{width:28px;height:28px;padding:0;border:0;border-radius:6px;background:none}.empty{color:var(--mt);text-align:center;padding:16px 8px}.chip.tg{padding:8px 14px;cursor:pointer;background:var(--sf);border:2px solid var(--ln);color:var(--mt)}.chip.tg.on{background:var(--bs);border-color:var(--bl);color:var(--bl)}
.sc{overflow-x:auto;margin:0 -4px}
table{border-collapse:separate;border-spacing:3px;width:100%;min-width:330px}
th{font-size:.75rem;color:var(--mt);font-weight:700;padding:4px}button[disabled]{opacity:.35;cursor:default}th small{display:block;font-weight:600;font-size:.62rem;opacity:.9}
td{padding:0;text-align:center;font-size:.72rem;vertical-align:top}
td.int{background:var(--ln);color:var(--mt);font-size:.68rem;padding:2px;border-radius:6px}
.av{width:100%;height:42px;border:0;border-radius:10px;font-weight:800;background:var(--gs);color:var(--gt)}
.av.off{background:var(--rs);color:var(--rt)}
.cell{border-radius:10px;padding:5px 3px;min-height:46px;line-height:1.2;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dm{border:2px dashed var(--ln);border-radius:16px;padding:10px;margin-bottom:10px}
.dm .row{margin-bottom:8px}
.ck{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-weight:600;font-size:.88rem;color:var(--tx)}
.ck input{width:20px;height:20px;accent-color:var(--bl)}
.pr{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.pr:first-child{border-top:0}
.av2{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#10201a;flex:none}
.pr div.i{flex:1;min-width:0}.pr small{display:block;color:var(--mt)}
.warn{background:var(--rs);color:var(--rt);border-left:4px solid var(--rd);padding:12px;border-radius:14px;margin-top:12px;font-size:.88rem}
.ok{background:var(--gs);border-left:4px solid var(--gn);padding:12px;border-radius:14px;margin-top:12px;font-weight:600}
textarea{width:100%;min-height:110px;border:2px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);padding:10px;font:12px monospace}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{display:flex;width:100%;max-width:536px;background:var(--bd);border-radius:24px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tabs button{flex:1;border:0;background:none;color:var(--bt);opacity:.65;padding:8px 2px;border-radius:18px;font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:1.3rem;line-height:1.1}
.tabs button.on{background:var(--yl);color:var(--yt);opacity:1}
.hint{font-size:.85rem;color:var(--mt);margin:0 0 4px}
@media print{.tabs,.top,.np{display:none!important}body{background:#fff}.app{padding:0}.card{box-shadow:none;border:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

#pv{display:none;flex-direction:column;width:281mm;height:192mm;overflow:hidden;color:#111;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--tx:#111;--mt:#333;--ln:#cfd6d9;--bl:#135d75;box-sizing:border-box}
#pv .pvh{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid #135d75;padding-bottom:8px;min-height:74px;flex:none}#pv .pvh>div:first-child{min-width:0;flex:1 1 auto}#pv .pvh>div:first-child>div{min-width:0}
#pv .pvs{font-weight:800;line-height:1.1;color:#0c3f50}
#pv .pvy{font-size:15px;font-weight:600;color:#333}
#pv .pvr{text-align:right;flex:0 1 42%;max-width:42%}#pv .pvt{font-size:21px;font-weight:800;color:#111}#pv .pvu{font-size:12px;color:#444}
#pv .pvb{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
#pv .pvc{flex:none;width:max-content;transform-origin:center center}
#pv .pvf{flex:none;border-top:2px solid #135d75;padding-top:6px;font-size:11px;color:#333;display:flex;justify-content:space-between;gap:14px;height:36px;line-height:1.35}
#pv table{min-width:0;width:auto;border-collapse:separate;border-spacing:2px}
#pv th{font-size:11px;color:#222;padding:2px 4px}#pv th small{font-size:9px;opacity:1}
#pv td{vertical-align:top}
#pv .cell{min-height:0;min-width:70px;padding:3px 5px;border-radius:5px;font-size:11px;line-height:1.15}
#pv .int{background:#e3e8ea;color:#333;font-size:10px;padding:1px;border-radius:3px}
#pv .pvq{table-layout:fixed;width:1040px;border-spacing:1px}#pv .pvq th{font-size:9px;padding:0 2px;white-space:nowrap}#pv .pvq th small{display:inline;font-size:8px}#pv .pvq td{padding:0;overflow:hidden}#pv .pvq .cell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px;line-height:1.3;padding:1px 4px;min-width:0;border-radius:3px}#pv .pvq.dn .cell{font-size:8.5px}#pv .pvq.d2 .cell{font-size:8px;padding:1px 2px}#pv .pvg{font-size:9px;line-height:1.35;margin-top:6px;color:#222}#pv .pvq .pvo{background:#e3e8ea;color:#888;text-align:center}#pv .pvq .pvd{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:800;width:26px}#pv .pvq .int{font-size:8px;line-height:1.2}#pv .tn{font-size:14px;font-weight:800;margin:0 0 4px;color:#111}
#pv .sc{overflow:visible;margin:0}
#pv img.pvl{width:56px;height:56px;border-radius:22%;object-fit:cover}
@media print{@page{size:A4 landscape;margin:8mm}html,body{background:#fff!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important}body::before{display:none!important}body>*:not(#pv){display:none!important}#pv{display:flex!important;page-break-inside:avoid;page-break-after:avoid}}
</style>

const nd=()=>({id:Date.now()+"",nome:"",email:"",max:5,off:{},agr:false,ef:false,dv:"",dias:[],dem:[nd1()]});
function vProf(){
 if(!S.turmas.length)return `<div class="card"><h2>Comece pelas turmas</h2><p class="hint">O formulário usa as turmas cadastradas.</p><button class="btn" onclick="go('cfg')">Cadastrar turmas</button></div>`;
 if(!draft)draft=nd();const d=draft,D=S.cfg.d,P=S.cfg.p,I=S.cfg.i;
 const gr=tn=>{let g=`<div class="tn">${TI[tn]} ${TN[tn]}</div><div class="sc"><table><tr><th></th>${DN.slice(0,D).map(x=>`<th>${x}</th>`).join("")}</tr>`;
  const PN=Pn(tn);for(let p=0;p<PN;p++){g+=`<tr>${thT(tn,p)}${Array.from({length:D},(_,i)=>{const o=d.off[tn+i+"-"+p];return `<td><button class="av ${o?"off":""}" onclick="tg('${tn+i}-${p}')">${o?"✕":"✓"}</button></td>`}).join("")}</tr>`;
   if(IV(tn)==p+1&&p<PN-1)g+=intT(tn,D+1)}
  return g+`</table></div>`};
 const used=TK.filter(k=>S.turmas.some(t=>S.tur[t]==k));
 const dem=d.dem.map((x,i)=>`<div class="dm"><div class="row"><div><input placeholder="Disciplina (ex.: Matemática)" value="${esc(x.disc)}" oninput="draft.dem[${i}].disc=this.value"></div></div><div class="hint" style="margin-top:8px">Turmas desta disciplina <a href="#" onclick="allT(${i});return false" style="color:var(--bl);font-weight:700">marcar todas</a></div><div class="chips" style="margin:6px 0 10px">${S.turmas.map((t,j)=>`<span class="chip tg ${x.turmas.includes(t)?"on":""}" onclick="toggleT(${i},${j})">${x.turmas.includes(t)?"✓ ":""}${esc(t)} ${TI[S.tur[t]]}</span>`).join("")}</div>
 <div class="row"><div><input type="number" min="1" max="${D*3}" value="${x.aulas}" oninput="draft.dem[${i}].aulas=+this.value" aria-label="Aulas por semana"></div><label class="ck" style="flex:1.6"><input type="checkbox" ${x.dup?"checked":""} onchange="draft.dem[${i}].dup=this.checked">Aulas geminadas</label><button class="btn g" style="flex:none;width:auto" onclick="dupD(${i})">Duplicar</button><button class="btn d" style="flex:none;width:auto" onclick="rmD(${i})">Remover</button></div></div>`).join("");
 return `<div class="card"><h2>${S.profs.some(p=>p.id==d.id)?"Editar professor":"Formulário do professor"}</h2>
 <label>Nome completo</label><input value="${esc(d.nome)}" oninput="draft.nome=this.value" placeholder="Ex.: Maria Souza"><label>Cor do professor no horário</label><input type="color" value="${d.cor||PAL[S.profs.length%PAL.length]}" oninput="draft.cor=this.value" style="height:46px;padding:4px"><label class="ck" style="color:var(--tx);margin-top:16px"><input type="checkbox" ${d.ef?"checked":""} onchange="draft.ef=this.checked">Vínculo efetivo</label><label>Data de vínculo (início na rede)</label><input type="date" value="${esc(d.dv||"")}" onchange="draft.dv=this.value"><p class="hint">Efetivos têm prioridade sobre os demais. Dentro de cada grupo, a data de vínculo mais antiga vem primeiro. Essa ordem define a prioridade na montagem do horário.</p>
 <div class="row"><div><label>E-mail (opcional)</label><input type="email" value="${esc(d.email)}" oninput="draft.email=this.value"></div><div><label>Máx. aulas/dia por turno</label><input type="number" min="1" max="${P}" value="${d.max}" oninput="draft.max=+this.value"></div></div>
 <label>Disciplinas, turmas e aulas por semana em cada turma. Use Duplicar para copiar a disciplina para outras turmas.</label>${dem}<button class="btn g" onclick="addD()">+ Outra disciplina</button>
 <label>Preferência de dias</label><label class="ck" style="color:var(--tx)"><input type="checkbox" ${d.agr?"checked":""} onchange="draft.agr=this.checked;render()">Concentrar minhas aulas nos mesmos dias (útil para quem trabalha em mais de um turno)</label>
 ${d.agr?`<div class="hint">Escolha os dias desejados. Sem escolha, o app usa o menor número de dias possível. A antiguidade define quem é atendido primeiro.</div><div class="chips" style="margin:8px 0">${DN.slice(0,D).map((n,i)=>`<span class="chip tg ${d.dias.includes(i)?"on":""}" onclick="tgDia(${i})">${d.dias.includes(i)?"✓ ":""}${n}</span>`).join("")}</div>`:""}
 <label>Disponibilidade: toque nos horários em que NÃO pode lecionar</label>${used.map(gr).join("")}
 <div style="display:grid;gap:10px;margin-top:16px"><button class="btn" onclick="saveP()">Salvar professor</button><button class="btn g" onclick="draft=null;render()">Limpar formulário</button></div></div>
 <div class="card"><h2>Ordem de antiguidade</h2><p class="hint">Ordem automática: efetivos primeiro; depois, a data de vínculo mais antiga. O 1º tem prioridade na montagem. As setas só desempatam professores com o mesmo vínculo e a mesma data.</p>${S.profs.map((p,k)=>`<div class="pr"><div style="display:flex;flex-direction:column;gap:2px;flex:none"><button class="btn g s" style="padding:2px 9px" onclick="mv(${k},-1)" aria-label="Subir" ${tieP(k,k-1)?"":"disabled"}>▲</button><button class="btn g s" style="padding:2px 9px" onclick="mv(${k},1)" aria-label="Descer" ${tieP(k,k+1)?"":"disabled"}>▼</button></div><div class="av2" style="background:${p.cor};color:${tx(p.cor)}">${k+1}º</div><div class="i"><b>${esc(p.nome)}</b><small>${p.ef?"Efetivo":"Não efetivo"}${p.dv?" · desde "+p.dv.split("-").reverse().join("/"):" · sem data de vínculo"}<br>${pl(p)} aulas · ${tns(p).map(x=>TN[x]).join(", ")||"sem turma"}${p.agr?" · concentra dias":""}</small></div><button class="btn g s" onclick="editP('${p.id}')">Editar</button><button class="btn d s" onclick="delP('${p.id}')">×</button></div>`).join("")||'<div class="empty">Nenhum professor ainda.</div>'}</div>
 ${S.profs.length?`<button class="btn" onclick="go('gen')">Continuar: gerar horário</button>`:""}`}
function tg(k){draft.off[k]=!draft.off[k];render()}
function tgDia(i){const a=draft.dias,k=a.indexOf(i);k>=0?a.splice(k,1):a.push(i);render()}
function addD(){draft.dem.push(nd1());render()}
function toggleT(i,j){const t=S.turmas[j],a=draft.dem[i].turmas,k=a.indexOf(t);k>=0?a.splice(k,1):a.push(t);render()}
function allT(i){const a=draft.dem[i];a.turmas=a.turmas.length==S.turmas.length?[]:S.turmas.slice();render()}
function dupD(i){draft.dem.splice(i+1,0,JSON.parse(JSON.stringify(draft.dem[i])));render()}
function rmD(i){draft.dem.splice(i,1);if(!draft.dem.length)draft.dem.push(nd1());render()}
const tieP=(i,j)=>!!S.profs[j]&&!!S.profs[i].ef===!!S.profs[j].ef&&(S.profs[i].dv||"")===(S.profs[j].dv||"");
function mv(k,s){const j=k+s;if(j<0||j>=S.profs.length)return;if(!tieP(k,j)){toast("A ordem segue o vínculo efetivo e a data de vínculo. As setas só desempatam quem tem o mesmo vínculo e a mesma data.");return}[S.profs[k],S.profs[j]]=[S.profs[j],S.profs[k]];S.hor=null;save();render()}
function saveP(){const d=draft;if(!d.nome.trim()){alert("Informe o nome do professor.");return}
 d.dem=d.dem.filter(x=>x.turmas.length&&x.disc.trim()&&x.aulas>0);
 if(S.profs.some(p=>p.id!=d.id&&p.nome.trim().toLowerCase()==d.nome.trim().toLowerCase())){alert("Já existe um professor com esse nome. Edite-o e adicione a outra disciplina nele.");return}
 if(!d.dem.length){alert("Preencha ao menos uma turma, disciplina e número de aulas.");return}
 if(!d.cor)d.cor=PAL[S.profs.length%PAL.length];const i=S.profs.findIndex(p=>p.id==d.id);i>=0?S.profs[i]=d:S.profs.push(d);ordP(S);S.hor=null;save();draft=null;render();scrollTo(0,0)}
function editP(id){draft=JSON.parse(JSON.stringify(S.profs.find(p=>p.id==id)));render();scrollTo(0,0)}
function delP(id){ask("Excluir este professor?",()=>{S.profs=S.profs.filter(p=>p.id!=id);S.hor=null;save();render()},"Excluir")}
/* Gerador: 3 turnos, antiguidade e concentração de dias */
function generate(){
 const D=S.cfg.d,P=S.cfg.p,I=S.cfg.i,dems=[];
 S.profs.forEach((p,r)=>{const q=Object.assign({},p,{id:p.nome.trim().toLowerCase()});p.dem.forEach(x=>x.turmas.forEach(t=>{if(S.turmas.includes(t))dems.push({p:q,r,t,tn:S.tur[t],disc:x.disc.trim(),n:+x.aulas,dup:x.dup})}))});
 const ptn={};dems.forEach(x=>(ptn[x.p.id]=ptn[x.p.id]||new Set()).add(x.tn));dems.forEach(x=>dcol(x.disc));const av=(p,tn)=>{let c=0;for(let d=0;d<D;d++)for(let s=0;s<P;s++)if(!p.off[tn+d+"-"+s])c++;return c};
 let best=null;
 for(let it=0;it<400&&(!best||best.fail>0||it<150);it++){
  const res={},busy={},load={},use={},pos={},tpos={},dt={},fail=[];S.turmas.forEach(t=>res[t]={});
  const ord=dems.map(x=>({x,k:x.r*1000+av(x.p,x.tn)/x.n-(x.dup?2:0)+Math.random()*5})).sort((a,b)=>a.k-b.k).map(o=>o.x);
  for(const x of ord){
   const pid=x.p.id,tn=x.tn,Pt=ppd(x.t),cnt={},ok=(d,s)=>{const k=d+"-"+s;return s<Pt&&!x.p.off[tn+k]&&!res[x.t][k]&&!busy[pid+tn+k]};
   const put=(d,s)=>{const k=d+"-"+s;res[x.t][k]={disc:x.disc,prof:x.p.nome};busy[pid+tn+k]=1;load[pid+tn+d]=(load[pid+tn+d]||0)+1;cnt[d]=(cnt[d]||0)+1;(use[pid]=use[pid]||{})[d]=1;(pos[pid+tn+d]=pos[pid+tn+d]||[]).push(s);(tpos[x.t+d]=tpos[x.t+d]||[]).push(s);(dt[pid+d]=dt[pid+d]||{})[tn]=1};
   const bias=d=>{if(!x.p.agr)return 0;const u=use[pid]||{},pf=x.p.dias||[];let b=0;if(pf.length&&!pf.includes(d))b+=500;if(Object.keys(u).length)b+=u[d]?-30:40;return b};
   const mx=x.p.max||P,ld=d=>load[pid+tn+d]||0;let rem=x.n;
   const mt=ptn[pid],ei=TK.indexOf(tn),hasL=TK.slice(ei+1).some(k=>mt.has(k)),hasE=TK.slice(0,ei).some(k=>mt.has(k));
   const pen=(d,sl)=>{const a=pos[pid+tn+d]||[],o=dt[pid+d]||{},near=(hasL&&TK.slice(ei+1).some(k=>o[k]))||(hasE&&TK.slice(0,ei).some(k=>o[k])),w=near?10:4,e=sl[0],f=sl[sl.length-1];let v=a.length?gd(a,sl)*25:0;v+=hasL&&!hasE?(Pt-1-f)*w:hasE&&!hasL?e*w:Math.min(e,Pt-1-f)*5;const b=tpos[x.t+d]||[];return v+(b.length?gd(b,sl)*12:e*2)};
   while(rem>0){
    let pick=null,bs=1e9;
    if(x.dup&&rem>=2){
     for(let d=0;d<D;d++)for(let s=0;s<Pt-1;s++){
      if(s+1==IV(tn)||!ok(d,s)||!ok(d,s+1)||ld(d)+2>mx||(cnt[d]||0)>0)continue;
      const sc=Math.random()*6+ld(d)*1.5+bias(d)+pen(d,[s,s+1]);if(sc<bs){bs=sc;pick={d,s,two:1}}}
    }
    if(!pick)for(let d=0;d<D;d++)for(let s=0;s<Pt;s++){
     if(!ok(d,s)||ld(d)>=mx)continue;
     const c=cnt[d]||0,sc=c*(c>=2?100:10)+ld(d)*1.5+Math.random()*6+bias(d)+pen(d,[s]);
     if(sc<bs){bs=sc;pick={d,s}}}
    if(!pick){fail.push(x);rem--;continue}
    put(pick.d,pick.s);if(pick.two){put(pick.d,pick.s+1);rem-=2}else rem--;
   }
  }
  let cost=fail.reduce((a,x)=>a+1000+(S.profs.length-x.r),0);
  for(const k in pos)cost+=gaps(pos[k])*10;for(const k in tpos)cost+=gaps(tpos[k])*4;
  for(const q in ptn)for(let d=0;d<D;d++)for(let e=0;e<2;e++){const a=pos[q+TK[e]+d],b=pos[q+TK[e+1]+d];if(a&&b)cost+=(P-1-Math.max(...a)+Math.min(...b))*6}
  S.profs.forEach(p=>{if(p.agr){const u=Object.keys(use[p.nome.trim().toLowerCase()]||{}).map(Number),pf=p.dias||[];cost+=u.length*8+u.filter(d=>pf.length&&!pf.includes(d)).length*60}});
  if(!best||cost<best.cost)best={res,cost,use,jan:Object.values(pos).reduce((a,v)=>a+gaps(v),0),fail:fail.length,list:fail.map(x=>x.p.nome+": "+x.disc+" ("+x.t+")")};
 }
 S.notes=S.profs.filter(p=>p.agr).map(p=>{const u=Object.keys(best.use[p.nome.trim().toLowerCase()]||{}).map(Number).sort(),pf=p.dias||[],out=pf.length&&u.some(d=>!pf.includes(d));return p.nome+": "+(u.map(d=>DN[d]).join(", ")||"sem aulas")+(out?" (parte fora dos dias preferidos)":"")});
 S.jan=best.jan;S.hor=best.res;S.fail=best.fail;S.list=best.list;save();render()}
function tbl(f,P0,tn){const D=S.cfg.d,P=P0||S.cfg.p,I=IV(tn);let h=`<div class="sc"><table><tr><th></th>${DN.slice(0,D).map(x=>`<th>${x}</th>`).join("")}</tr>`;
 for(let s=0;s<P;s++){h+=`<tr>${thT(tn,s)}`;for(let d=0;d<D;d++){const c=f(d+"-"+s);h+=`<td>${c?`<div class="cell" style="${cstyle(c)}"><b>${esc(c.disc)}</b><br>${esc(c.prof)}</div>`:""}</td>`}h+=`</tr>`;if(I==s+1&&s<P-1)h+=intT(tn,D+1)}
 return h+`</table></div>`}
const DNL=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
function tbn(tn,dsel){const D=S.cfg.d,I=IV(tn),P=Pn(tn),ts=S.turmas.filter(t=>S.tur[t]==tn);let h="";
 for(let d=0;d<D;d++){if(dsel!="a"&&+dsel!=d)continue;
  h+=`<div class="tn">${DNL[d]}</div><div class="sc"><table><tr><th></th>${ts.map(t=>`<th>${esc(t)}</th>`).join("")}</tr>`;
  for(let s=0;s<P;s++){h+=`<tr>${thT(tn,s)}`;
   for(const t of ts){const off=s>=ppd(t),c=off?null:S.hor[t]?.[d+"-"+s];
    h+=`<td>${off?`<div class="cell" style="background:var(--ln);color:var(--mt);opacity:.5;display:grid;place-items:center">—</div>`:c?`<div class="cell" style="${cstyle(c)}"><b>${esc(c.disc)}</b><br>${esc(c.prof)}</div>`:""}</td>`}
   h+=`</tr>`;if(I==s+1&&s<P-1)h+=intT(tn,ts.length+1)}
  h+=`</table></div>`}
 return h}
function resumoN(tn){const m={};S.turmas.filter(t=>S.tur[t]==tn).forEach(t=>Object.values(S.hor[t]||{}).forEach(c=>{const o=m[c.prof]||(m[c.prof]={d:{},n:0});o.d[c.disc]=(o.d[c.disc]||0)+1;o.n++}));
 const nm=S.profs.map(p=>p.nome).filter(n=>m[n]);
 return `<h2 style="margin-top:18px">Professores e disciplinas</h2>`+(nm.map(n=>`<div class="pr"><div class="av2" style="background:${pcol(n)};color:${tx(pcol(n))}">${esc(n[0]||"?")}</div><div class="i"><b>${esc(n)}</b><small>${Object.entries(m[n].d).map(([k,v])=>esc(k)+" ("+v+")").join(", ")} · ${m[n].n} aulas</small></div></div>`).join("")||'<div class="empty">Sem aulas neste turno.</div>')}
function vGen(){
 if(!S.turmas.length||!S.profs.length)return `<div class="card"><h2>Faltam dados</h2><p class="hint">Cadastre turmas e ao menos um professor para gerar o horário.</p></div>`;
 let h=`<div class="card"><h2>Gerar horários</h2><p class="hint">Monta manhã, tarde e noite de uma vez. Professores mais antigos escolhem primeiro. Ninguém fica em duas turmas no mesmo horário. Quem pediu concentração de dias tem os turnos encaixados nos mesmos dias.</p><div style="margin-top:12px"><button class="btn" onclick="generate()">${S.hor?"Gerar novamente":"✨ Gerar horários"}</button></div>`;
 if(S.hor){h+=S.fail?`<div class="warn"><b>${S.fail} aula(s) sem lugar.</b> Libere horários ou reduza a carga:<br>${(S.list||[]).map(esc).join("<br>")}</div>`:`<div class="ok">Horários completos, sem choques.</div>`;
  h+=`<div class="ok">Janelas entre aulas dos professores: <b>${S.jan||0}</b></div>`;if((S.notes||[]).length)h+=`<div class="ok"><b>Dias concentrados</b><br>${S.notes.map(esc).join("<br>")}</div>`}
 h+=`</div>`;if(!S.hor)return h;
 const opts=view.m=="t"?S.turmas:view.m=="n"?TK.filter(k=>S.turmas.some(t=>S.tur[t]==k)):S.profs.map(p=>p.nome);
 if(!opts.includes(view.k))view.k=opts[0];
 h+=`<div class="card"><div class="row np"><div><label>Ver por</label><select onchange="view.m=this.value;view.k='';render()"><option value="t" ${view.m=="t"?"selected":""}>Turma</option><option value="p" ${view.m=="p"?"selected":""}>Professor (todos os turnos)</option><option value="n" ${view.m=="n"?"selected":""}>Turno (visão geral)</option></select></div><div><label>${view.m=="t"?"Turma":view.m=="n"?"Turno":"Professor"}</label><select onchange="view.k=this.value;render()">${opts.map(o=>`<option value="${esc(o)}" ${o==view.k?"selected":""}>${view.m=="n"?TI[o]+" "+TN[o]:esc(o)}${view.m=="t"?" · "+TN[S.tur[o]]:""}</option>`).join("")}</select></div></div><div class="row np" style="margin-top:8px"><div><label>Cores</label><select onchange="S.cm=this.value;save();render()"><option value="p" ${(S.cm||"p")=="p"?"selected":""}>Colorido por professor</option><option value="d" ${S.cm=="d"?"selected":""}>Colorido por disciplina</option><option value="b" ${S.cm=="b"?"selected":""}>Preto e branco</option></select></div>${view.m=="n"?`<div><label>Dia</label><select onchange="view.dy=this.value;render()"><option value="a" ${(view.dy||"a")=="a"?"selected":""}>Todos os dias</option>${DNL.slice(0,S.cfg.d).map((n,i)=>`<option value="${i}" ${view.dy==String(i)?"selected":""}>${n}</option>`).join("")}</select></div>`:""}</div><div class="hint" style="margin-top:12px">${esc(ce().nome)} · ${ce().ano}</div><h2 style="margin:4px 0 0">${view.m=="n"?TI[view.k]+" "+TN[view.k]:esc(view.k)}</h2>`;
 if(view.m=="n")h+=tbn(view.k,view.dy||"a")+resumoN(view.k);else if(view.m=="t")h+=`<div class="tn">${TI[S.tur[view.k]]} ${TN[S.tur[view.k]]}</div>`+tbl(k=>S.hor[view.k]?.[k],ppd(view.k),S.tur[view.k]);
 else{const p=S.profs.find(p=>p.nome==view.k);for(const tn of tns(p))h+=`<div class="tn">${TI[tn]} ${TN[tn]}</div>`+tbl(k=>{for(const t of S.turmas){const x=S.hor[t]?.[k];if(S.tur[t]==tn&&x&&x.prof==view.k)return{disc:x.disc,prof:t,pn:x.prof}}},Pn(tn),tn)}
 return h+legend()+`<div style="margin-top:14px" class="np"><p class="hint">Para salvar em PDF, toque em Imprimir e escolha Salvar como PDF. As cores saem na impressão.</p><button class="btn g" onclick="prn()">Imprimir / salvar PDF</button></div></div>`}
function vBak(){return `<div class="card"><h2>Backup</h2><p class="hint">Os dados ficam neste aparelho. Copie o texto abaixo para guardar ou levar a outro celular. Para importar, cole e toque em Importar.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><div style="display:grid;gap:10px;margin-top:12px"><button class="btn" onclick="impB()">Importar dados</button><button class="btn d" onclick="if(confirm('Apagar tudo?')){S={cfg:{d:5,p:5,i:2},turmas:[],tur:{},profs:[],hor:null,fail:0};save();draft=null;go('cfg')}">Apagar tudo</button></div></div>
 <div class="card"><h2>Instalar o EVA</h2><p class="hint"><b>iPhone:</b> Safari, botão Compartilhar, Adicionar à Tela de Início.<br><b>Android:</b> Chrome, menu ⋮, Instalar app ou Adicionar à tela inicial.</p></div>`}
function impB(){try{const o=JSON.parse(document.getElementById("bk").value);if(!o.cfg||!o.turmas||!o.profs)throw 0;if(o.cfg.i===undefined)o.cfg.i=0;norm(o);S=o;save();draft=null;alert("Dados importados.");go("cfg")}catch(e){alert("Texto inválido. Cole exatamente o conteúdo exportado.")}}
render();
</script>
<div id="pv"></div>
</body>
</html>
